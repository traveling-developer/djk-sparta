name: Generating Instagram Posts

on:
  # Ergebnisse, Ankündigungen und Wochenend-Rückblick laufen getrennt: jeder
  # Lauf ruft mytischtennis ab, alles zusammen löst das Captcha aus.
  # Die Cron-Strings müssen exakt zu ONLY im Generate-Step passen.
  schedule:
    - cron: "30 14 * * *" # Ergebnisse von gestern
    - cron: "30 16 * * *" # Spielankündigungen in zwei Tagen
    - cron: "0 8 * * 1" # Montag 10:00 MESZ / 09:00 MEZ: Wochenend-Rückblick Tischtennis (Feed-Post)

  workflow_dispatch:
    inputs:
      only:
        description: "Welche Inhalte"
        type: choice
        options: [results, announcements, weekend, all]
        default: results

permissions:
  contents: read

env:
  BUILD_PATH: "instagram-generator"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      exit-code: ${{ steps.generate.outputs.exit-code }}
    steps: &steps
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/website/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/website/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/${{ steps.detect-package-manager.outputs.lockfile }}
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        working-directory: ${{ env.BUILD_PATH }}
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
        working-directory: ${{ env.BUILD_PATH }}
      - name: Run instagram generator
        id: generate
        working-directory: ${{ env.BUILD_PATH }}
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || (github.event.schedule == '30 16 * * *' && 'announcements' || (github.event.schedule == '0 8 * * 1' && 'weekend' || 'results')) }}
        shell: bash
        # Exit-Code 2 = Inhalte konnten nicht gesammelt werden, noch nichts
        # veröffentlicht (meist Captcha-Sperre der Runner-IP bei mytischtennis).
        # Im Retry-Job erst warten: die Captcha-Sperre löst sich nach ca. 4 min.
        run: |
          if [ "$GITHUB_JOB" = "retry" ]; then sleep 300; fi
          set +e
          npm run generate
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit $code

  # Zweiter Versuch auf einem frischen Runner (meist andere IP) nach 5 min
  # Wartezeit. Nur bei Exit-Code 2, sonst drohen doppelte Posts.
  retry:
    name: Retry (neuer Runner)
    needs: build
    if: failure() && needs.build.outputs.exit-code == '2'
    runs-on: ubuntu-latest
    steps: *steps
